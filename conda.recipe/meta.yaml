package:
  name: momentrt
  version: "0.12.2"

source:
  # Build the checked-out revision, including uncommitted local changes.
  path: ..

build:
  noarch: python
  number: 0
  script: '"{{ PYTHON }}" -m pip install . -vv --no-deps --no-build-isolation'

requirements:
  host:
    - python 3.11.*
    - pip
    - setuptools >=77.0.3
    - wheel
  run:
    - python >=3.11
    - numpy >=1.26
    - scipy >=1.12
    - pint >=0.24,<0.26
    - typedunit >=0.6.0,<0.7
    - matplotlib >=3.8
    - plotly >=6,<7
    - gmsh >=4.13,<5
    - python-gmsh >=4.13,<5

test:
  imports:
    - MomentRT
  requires:
    - python {{ PY_VER }}.*
    - pytest >=8
  source_files:
    - tests
    - docs/examples
    - pyproject.toml
    - CITATION.cff
    - .zenodo.json
    - LICENSE
    - conda.recipe/meta.yaml
  commands:
    - python -m pytest -q tests

about:
  license: MIT
  license_file: LICENSE
  summary: "Python tools for deterministic light transport in scattering media using diffusion and spherical-harmonic finite-element models."
  description: >-
    MomentRT models deterministic light transport in scattering media with
    analytical diffusion and finite-element P1, SP3, and P3 models. It includes
    optical-field visualization, contact detectors, and energy diagnostics.

extra:
  recipe-maintainers:
    - MartinPdeS
