[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "MomentRT"
version = "0.8.0"
description = "Deterministic light transport using angular-moment methods."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Martin Poinsinet de Sivry-Houle", email = "martin.poinsinet.de.sivry@gmail.com" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Jupyter",
    "Framework :: Sphinx",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pint>=0.24",
    "matplotlib>=3.8",
]

keywords = [
    "radiative transfer",
    "light transport",
    "diffusion",
    "spherical harmonics",
    "finite element method",
    "tissue optics",
]

[project.optional-dependencies]
release = ["martinpdes-maintenance==0.2.2"]
testing = [
    "pytest>=8",
    "pytest-cov>=5",
]
documentation = [
    "MartinPdeS-docs>=0.5,<0.6",
    "plotly>=6,<7",
]
dev = [
    "mypy>=1.15",
    "numpydoc>=1.8",
    "pytest>=8",
    "ruff",
    "build",
]
viz = ["plotly>=6,<7"]
vtk = ["pyvista>=0.46,<0.50"]

[project.urls]
Homepage = "https://github.com/MartinPdeS/MomentRT"
Repository = "https://github.com/MartinPdeS/MomentRT"
Issues = "https://github.com/MartinPdeS/MomentRT/issues"
Documentation = "https://martinpdes.github.io/MomentRT/docs/latest/"

[tool.setuptools.package-data]
MomentRT = ["py.typed", "materials/*.csv"]

[tool.setuptools.packages.find]
include = ["MomentRT*"]

[tool.mps-maintenance]
version-file = "MomentRT/_version.py"
version-method = "literal"
conda-recipe = "conda.recipe/meta.yaml"
citation = "CITATION.cff"
zenodo = ".zenodo.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
no-lines-before = ["standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
