name: Deploy coverage

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  coverage:
    name: Run tests and generate coverage data
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python and CI dependencies
        uses: MartinPdeS/MPSActions/actions/setup-python@v2
        with:
          python-version: "3.11"
          install-command: >-
            python -m pip install --upgrade pip wheel build && python -m pip install -e ".[testing,viz]"
          fetch-depth: 0

      - name: Run pytest with coverage
        run: >-
          python -m pytest --cov=MomentRT --import-mode=importlib
          --cov-config=.coveragerc --cov-report=term-missing
          --cov-report=xml:coverage.xml tests

      # Fork pull requests do not receive a writable token.
      - name: Post coverage comment
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 50
          COVERAGE_PATH: .
