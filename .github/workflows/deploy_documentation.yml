name: Documentation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  documentation:
    uses: MartinPdeS/MPSActions/.github/workflows/build_documentation.yml@v2
    with:
      python-version: "3.11"
      package-name: MomentRT
      fail-on-sphinx-warning: true
